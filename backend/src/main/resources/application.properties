spring.application.name=enviro-junior-developer-assessment

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:enviro
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console, viewable at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let Hibernate create/update tables automatically from our entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
